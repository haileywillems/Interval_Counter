<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Down Timer</title>
    <style>
        body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        text-align: center;
        padding-top: 60px;
        }


        .container {
        background: white;
        width: 300px;
        margin: auto;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }


        #count {
        font-size: 40px;
        font-weight: bold;
        margin: 20px 0;
        }


        button {
        padding: 10px 18px;
        margin: 5px;
        border: none;
        border-radius: 8px;
        background-color: #2563eb;
        color: white;
        cursor: pointer;
        font-size: 16px;
        }


        button:hover {
        background-color: #1d4ed8;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>Interval Counter</h1>
        <p id="count">0</p>
        <button onclick="start()">Start</button>
        <button onclick="stop()">Stop</button>
        <button onclick="reset()">Reset</button>
    </div>
   <!-- <p>Enter the countdown starting number, then click the start button.</p> -->
   <!-- <input type="number" id="number" min="0" value="5"> -->
   

   <script>
        let count = 0
        let intervalId = null
        //means no active interval exists

        function start(){
            if(intervalId !== null){//to avoid accidentally create two or three counters
                console.log("Counter is Running")
                return
            }
            console.log("Starting counter...")
            intervalId = setInterval(function(){
                count++
                document.getElementById("count").textContent = count
                console.log("Count: ", count)
            }, 1000)
            console.log("Interval ID: ", intervalId)
        }

        function stop(){
            if(intervalId == null){//after stopping, interval ID is set back to null
                console.log("No Active Interval")
                return
            }
            clearInterval(intervalId)
            console.log("Counter Stopped")
            intervalId = null
        }

        function reset(){
            stop()
            count=0
            document.getElementById("count").textContent = count
            console.log("Counter Reset")
        }
   </script>
</body>
</html>
